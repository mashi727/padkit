<svg width="869.5" height="635.2" viewBox="0 0 869.5 635.2" xmlns="http://www.w3.org/2000/svg">
    <title>
        リリースを行う
	:comment 準備
	リリース対象のコミットを定める
	:call 変更履歴を作成する
	:comment 検証
	:while 未解決の不具合が残っているか
		不具合を一件選ぶ
		:if 今回のリリースで直すべきか
			修正して回帰テストを追加する
		:else
			次版のマイルストーンへ移す
	:dowhile CI が失敗しているか
		CI の失敗原因を調べて直す
	:comment 公開
	:switch 公開先はどこか
	:case PyPI
		wheel と sdist をアップロードする
	:case 社内配布
		社内レジストリへ登録する
	:if 公開後の動作確認に失敗したか
		直前の版へ戻す@原因を記録する
	:else
		リリースノートを公開する
	:terminal 完了
    </title>
